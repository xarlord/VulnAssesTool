name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

# SR-03 (update security). The app ships as a self-hosted web server + CLI (Node), not signed
# desktop installers — it migrated off Electron (commit acd0518), so there are NO platform
# binaries to code-sign. Release integrity is therefore provided by SHA256 checksums of the
# published tarball (verifiable with `sha256sum -c checksums.txt`, generated by the tested
# scripts/lib/checksums.mjs), backed by the source/dependency controls in ci.yml (CodeQL +
# Dependabot, SR-02). Rollback = redeploy a previous tagged tarball; DB-schema rollback is
# covered by server/database/migrations/v2SchemaMigration.ts::rollbackToVersion.

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (client + server + CLI)
        run: npm run build:all

      - name: Package release tarball
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          mkdir -p release
          tar -czf "release/vulnasstool-${VERSION}.tar.gz" \
            dist package.json package-lock.json README.md docs/DEPLOYMENT.md
          echo "Packaged release/vulnasstool-${VERSION}.tar.gz"

      - name: Generate SHA256 checksums
        run: npm run checksums

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/vulnasstool-*.tar.gz
            release/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## VulnAssessTool ${{ github.ref_name }}

            Self-hosted vulnerability-assessment web app (Express + React) and the `vulnshield` CLI.

            ### Install

            ```sh
            sha256sum -c checksums.txt          # verify integrity first (see Verification)
            tar -xzf vulnasstool-<version>.tar.gz
            npm ci --omit=dev
            npm start                            # serves on http://localhost:3001
            ```

            See the [Deployment Guide](docs/DEPLOYMENT.md) for env vars, ports, and `SYFT_PATH`.

            ### Verification

            Release integrity is provided by SHA256 checksums in `checksums.txt`:

            ```sh
            sha256sum -c checksums.txt
            ```

            This is a self-hosted Node application, not a signed desktop installer — there are no
            platform binaries to code-sign. Source and dependency integrity are enforced in CI via
            CodeQL and Dependabot.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
