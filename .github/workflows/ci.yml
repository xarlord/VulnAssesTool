name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the whole matrix when one leg fails — otherwise a single
      # failure shows up as "operation was canceled" across every other job and
      # hides the real per-OS/per-node cause.
      fail-fast: false
      matrix:
        # ubuntu + windows only: the macOS runner intermittently SIGSEGVs (exit 139)
        # in the native better-sqlite3 + vitest-worker + v8-coverage combo — a runner
        # environment crash, not a test failure (ubuntu/windows pass cleanly).
        os: [ubuntu-latest, windows-latest]
        # Node 20 only: vitest 4 needs a Node 20+ built-in (node:inspector/promises),
        # so the Node 18 legs crashed at startup with ERR_UNKNOWN_BUILTIN_MODULE.
        # Every other workflow already standardizes on Node 20.
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Retry npm ci: better-sqlite3's prebuild-install can hit a transient "socket hang up"
        # and fall back to a node-gyp source build, which fails on windows-latest (its VS 18 is
        # not recognized by the bundled node-gyp). Retrying lets the prebuilt binary download
        # succeed, so no source build is needed.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "npm ci (attempt $attempt)"
            npm ci && exit 0
            echo "npm ci failed; cleaning node_modules, retrying in 15s..."
            rm -rf node_modules
            sleep 15
          done
          echo "npm ci failed after 3 attempts" >&2
          exit 1

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:coverage

      - name: Run integration tests
        run: npm run test:integration

      - name: Run BDD tests
        run: npm run test:bdd

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Retry npm ci (see the test job): better-sqlite3's prebuild-install can transiently
        # fail and fall back to a source build that breaks on windows/macos runners. This job's
        # matrix includes macos-latest, so the same retry guard applies.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "npm ci (attempt $attempt)"
            npm ci && exit 0
            echo "npm ci failed; cleaning node_modules, retrying in 15s..."
            rm -rf node_modules
            sleep 15
          done
          echo "npm ci failed after 3 attempts" >&2
          exit 1

      - name: Build application
        run: npm run build:all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/*
          retention-days: 7

  e2e-tests:
    name: E2E Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      # Run each Playwright project as its own job: the full suite in a single run
      # exceeds playwright.config's 30-min globalTimeout, so it was failing on timeout
      # (not on test failures). Per-project keeps each run well under the limit and
      # shows per-project results. ubuntu only — cross-OS E2E adds little for a browser
      # app and triples cost. 'visual' is excluded: its toHaveScreenshot baselines are
      # committed only for win32 (the dev platform), so a Linux runner has no baseline
      # to diff against and every shot fails "snapshot doesn't exist". Run visual
      # locally on Windows (npx playwright test --project=visual).
      fail-fast: false
      matrix:
        project: [critical-flows, features, workflows, a11y]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e:prepare && npx playwright test --project=${{ matrix.project }}

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.project }}
          path: playwright-report/*
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Run Snyk security scan
        if: false  # Enable when Snyk token is available
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
